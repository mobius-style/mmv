# MOBIUS MMV — Wikipedia / Box W index source declaration.
#
# This config is read by `scripts/fetch_wiki_index.py` to populate the
# `Wiki/` directory after a fresh clone. The runtime gitignores the
# actual index/chunk files (they are derived data, ~11 GB for English) and pulls
# them from the source declared here.
#
# To switch sources (e.g. internal S3 / GCS mirror), edit `base_url`
# below or pass `--source-url` to the fetch script. The HF Hub default
# is the project-author-maintained mirror.

source:
  # The default mirror. The fetch script supports any base URL that
  # serves the listed files at `{base_url}/{file}` (or, for HF Hub, at
  # `{base_url}/resolve/main/{file}`).
  kind: huggingface_dataset
  base_url: https://huggingface.co/datasets/moebiusT7/mmv-wiki-index

  # Branch / revision on the HF Hub dataset repo. Pinning a revision
  # gives reproducible installs; `main` follows the latest snapshot.
  revision: main

# Required files. The fetch script downloads each, verifies the SHA256,
# and places them in `Wiki/` at the repository root.
#
# Snapshot identity (must match the manifest on the HF side):
#   - ZIM source     : wikipedia_en_all_mini_2026-06.zim
#   - Embedding model: intfloat/multilingual-e5-large (1024-dim, CPU,
#                      "query: " / "passage: " prefix convention)
#   - Index type     : IndexIVFScalarQuantizer, QT_4bit (nlist=4096, INNER_PRODUCT)
#                      (the file name keeps "ivfpq" for compatibility; see docs/WIKI_INDEX_V11.md)
#   - Vector count   : 15,648,632
#   - Built at       : 2026-09-15/16 (v11b: render-faithful extraction, 256-token sentence
#                      chunks, SQ4 with a residual-quantile range)
#   - Recommended    : nprobe=128, open with faiss.IO_FLAG_MMAP (index is 8.2 GB)

files:
  - name: wiki_index_ivfpq_me5.faiss
    dest: Wiki/wiki_index_ivfpq_me5.faiss
    bytes: 8154107000
    sha256: a5881e5b55a1b0e795b0f21d640fee313d9882b5aab40d0f694608831945766d
    required: true
    description: ME5 IVF,SQ4 FAISS index (15,648,632 vectors). Open with IO_FLAG_MMAP.

  - name: wiki_chunks.jsonl.gz
    dest: Wiki/wiki_chunks.jsonl.gz
    bytes: 2717847554
    sha256: 8f2cda555d3a05e0e332745bc225e36ebfff3566c4ff4944434b2fb730d5c677
    required: true
    description: Chunk store (JSONL, gzip). Line i backs FAISS vector i.

  - name: line_offsets.npy
    dest: Wiki/line_offsets.npy
    bytes: 125189184
    sha256: 837a33a41215203f8718ff858a07eba00c7201b0cc614db478bb6aa32bedc23c
    required: true
    description: Numpy line-offset table for O(1) chunk lookup by index id.

  - name: line_offsets.gzidx
    dest: Wiki/line_offsets.gzidx
    bytes: 4852381
    sha256: e58af1f1d19bdd5b3e056ed89323f0b472011c56cc0f60bfe0b38b362b119034
    required: false
    description: |
      indexed_gzip seek index for the chunk store. Optional: the adapter
      builds one on first use if it is absent, which costs a full pass
      over the 2.7 GB file. With it, reading a line near the end of the
      store takes 0.13 s instead of 28 s.


  - name: wiki_manifest.json
    dest: Wiki/wiki_manifest.json
    bytes: 1511
    sha256: 207e38033600fa14efd13d38ac482d60ca409acbffedbdfa7116c8ba2da8c937
    required: false
    description: |
      Build manifest for this snapshot: ZIM source, extractor, chunker,
      token budget, index type and the range fit. The runtime does not
      depend on it; the canonical ME5 binding lives in CLAUDE.md and the
      HF dataset README.

# Local destination root (relative to repo root). Override on the CLI
# with `--dest-root <path>` if you keep the index in a non-default
# location (e.g. on a separate SSD).
dest_root: .
